<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="健身搭子">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="女性健身训练计划助手 - 肌肥大周期化训练">
<title>健身搭子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0f1115; --card:#1a1d24; --border:#2a2d34; --accent:#4ec9b0;
  --text:#e0e0e0; --text2:#888; --danger:#e06c75; --warn:#ffaa00;
}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hidden{display:none!important;}

/* ===== 顶部导航 ===== */
.navbar{background:var(--card);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.navbar .logo{font-size:18px;font-weight:700;color:var(--accent);}
.navbar .nav-btns{display:flex;gap:8px;}
.nav-btn{padding:6px 14px;border:1px solid var(--border);background:transparent;color:var(--text2);border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;}
.nav-btn:hover,.nav-btn.active{border-color:var(--accent);color:var(--accent);}

/* ===== 通用 ===== */
.container{max-width:960px;margin:0 auto;padding:20px;}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid var(--border);}
.card-title{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--accent);}
.btn{padding:10px 24px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;}
.btn-primary{background:var(--accent);color:var(--bg);}
.btn-primary:hover{opacity:0.85;}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{border-color:var(--accent);}
.btn-danger{background:var(--danger);color:#fff;}
input,select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:14px;width:100%;}
input:focus,select:focus{outline:none;border-color:var(--accent);}
label{font-size:13px;color:var(--text2);margin-bottom:4px;display:block;}

/* ===== 问卷 ===== */
.quiz-step{display:none;}
.quiz-step.active{display:block;}
.quiz-progress{display:flex;gap:4px;margin-bottom:20px;}
.quiz-progress .seg{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s;}
.quiz-progress .seg.done{background:var(--accent);}
.quiz-progress .seg.current{background:var(--accent);}
.quiz-option{padding:14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:8px;transition:all .15s;}
.quiz-option:hover{border-color:var(--accent);}
.quiz-option.selected{border-color:var(--accent);background:rgba(78,201,176,0.1);}
.quiz-option .opt-label{font-size:15px;font-weight:600;}
.quiz-option .opt-desc{font-size:12px;color:var(--text2);margin-top:4px;}
.quiz-nav{display:flex;justify-content:space-between;margin-top:20px;}

/* ===== 周计划看板 ===== */
.week-dashboard{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
@media(max-width:768px){.week-dashboard{grid-template-columns:repeat(2,1fr);}}
.day-card{background:var(--card);border-radius:10px;padding:12px;border:1px solid var(--border);cursor:pointer;transition:all .2s;min-height:100px;}
.day-card:hover{border-color:var(--accent);}
.day-card.rest{opacity:0.5;}
.day-card.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(78,201,176,0.2);}
.day-card .day-name{font-size:12px;color:var(--text2);margin-bottom:6px;}
.day-card .day-type{font-size:14px;font-weight:600;}
.day-card .day-type.rest{color:var(--text2);}
.day-card .ex-count{font-size:11px;color:var(--text2);margin-top:4px;}
.day-card .done-badge{font-size:10px;color:var(--accent);margin-top:4px;}

/* ===== 训练卡 ===== */
.training-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.training-header .title{font-size:20px;font-weight:700;}
.exercise-item{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--border);}
.exercise-item .ex-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.exercise-item .ex-name{font-size:15px;font-weight:600;}
.exercise-item .ex-muscle{font-size:11px;color:var(--text2);margin-top:2px;}
.exercise-item .ex-params{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.exercise-item .param-tag{background:var(--border);padding:3px 8px;border-radius:5px;font-size:11px;color:var(--text2);}
.exercise-item .param-tag .val{color:var(--text);font-weight:600;}
.exercise-item .ex-note{font-size:11px;color:var(--accent);margin-bottom:8px;}
.sets-table{width:100%;margin-top:8px;}
.sets-table th{font-size:11px;color:var(--text2);text-align:left;padding:4px;font-weight:400;}
.sets-table td{padding:4px;}
.set-input{width:60px!important;padding:4px 8px!important;font-size:13px!important;text-align:center;}
.set-row .set-num{color:var(--text2);font-size:12px;width:30px;}
.cue-toggle{font-size:12px;color:var(--accent);cursor:pointer;margin-top:6px;}
.cue-content{display:none;margin-top:8px;padding:8px;background:var(--bg);border-radius:8px;font-size:12px;line-height:1.8;color:var(--text2);}
.cue-content.show{display:block;}
.cue-content .cue-section{margin-bottom:8px;}
.cue-content .cue-section-title{color:var(--accent);font-weight:600;margin-bottom:4px;}
.cue-content .error-list li{color:#c8a0a0;}

/* ===== 训练总结 ===== */
.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.summary-stat{background:var(--card);border-radius:10px;padding:14px;text-align:center;}
.summary-stat .stat-num{font-size:24px;font-weight:700;color:var(--accent);}
.summary-stat .stat-label{font-size:11px;color:var(--text2);margin-top:4px;}

/* ===== 营养建议 ===== */
.nutrition-card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);}
.nutrition-card .macro{display:flex;gap:16px;margin-bottom:12px;}
.nutrition-card .macro-item{text-align:center;flex:1;}
.nutrition-card .macro-item .macro-num{font-size:28px;font-weight:700;}
.nutrition-card .macro-item .macro-unit{font-size:12px;color:var(--text2);}
.nutrition-card .macro-item.protein .macro-num{color:var(--accent);}
.nutrition-card .macro-item.carb .macro-num{color:var(--warn);}
.food-option{background:var(--bg);border-radius:8px;padding:10px;margin-bottom:8px;}
.food-option .fo-name{font-size:13px;font-weight:600;margin-bottom:4px;}
.food-option .fo-items{font-size:12px;color:var(--text2);}
.food-option .fo-items .qty{font-size:10px;color:var(--text3);}
.food-option .fo-tag{display:inline-block;font-size:10px;font-weight:400;color:var(--accent);background:rgba(78,201,176,0.12);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;}

/* ===== 时段选择器 ===== */
.timeslot-selector{display:flex;gap:8px;margin-bottom:14px;}
.timeslot-btn{flex:1;padding:10px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;text-align:center;transition:all 0.2s;font-size:13px;color:var(--text2);}
.timeslot-btn.active{border-color:var(--accent);background:rgba(78,201,176,0.08);color:var(--accent);font-weight:600;}
.timeslot-btn .ts-icon{display:block;font-size:18px;margin-bottom:2px;}
.timeslot-btn .ts-label{font-size:12px;}
.timeslot-btn .ts-desc{font-size:10px;color:var(--text3);margin-top:2px;}
.timeslot-btn.active .ts-desc{color:var(--accent);opacity:0.7;}

/* ===== 营养问答卡片 ===== */
.nutri-q{background:var(--bg);border-radius:8px;margin-bottom:8px;overflow:hidden;border:1px solid var(--border);}
.nutri-q .nq-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text1);}
.nutri-q .nq-toggle .nq-arrow{font-size:11px;color:var(--text3);transition:transform 0.2s;}
.nutri-q.open .nq-arrow{transform:rotate(180deg);}
.nutri-q .nq-answer{display:none;padding:0 12px 10px;font-size:12px;color:var(--text3);line-height:1.6;}
.nutri-q.open .nq-answer{display:block;}

/* ===== 鼓励语 ===== */
.encourage-box{background:linear-gradient(135deg,rgba(78,201,176,0.15),rgba(78,201,176,0.05));border:1px solid rgba(78,201,176,0.3);border-radius:12px;padding:16px;margin-bottom:16px;text-align:center;}
.encourage-box .enc-text{font-size:15px;line-height:1.6;}

/* ===== 进度页 ===== */
.progress-section{margin-bottom:20px;}
.progress-bar-wrap{background:var(--border);border-radius:8px;height:24px;overflow:hidden;margin-bottom:8px;}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--bg);font-weight:600;transition:width .5s;}

/* ===== 空状态 ===== */
.empty-state{text-align:center;padding:60px 20px;}
.empty-state .icon{font-size:48px;margin-bottom:16px;}
.empty-state .title{font-size:18px;font-weight:600;margin-bottom:8px;}
.empty-state .desc{font-size:13px;color:var(--text2);margin-bottom:20px;}

/* ===== 返回高亮 ===== */
@keyframes highlightPulse {
  0% { box-shadow: 0 0 0 0 rgba(78,201,176,0.5); border-color: var(--accent); }
  50% { box-shadow: 0 0 0 6px rgba(78,201,176,0.15); border-color: var(--accent); }
  100% { box-shadow: 0 0 0 0 rgba(78,201,176,0); }
}
.day-card.just-returned { animation: highlightPulse 1.5s ease-out; }
.day-card.skipped { opacity:0.5; border-style:dashed; }
.day-card .skip-badge { font-size:10px; color:var(--text2); margin-top:4px; }
.day-card .skip-btn { font-size:11px; color:var(--text2); background:none; border:1px solid var(--border); border-radius:5px; padding:2px 8px; cursor:pointer; margin-top:6px; transition:all .2s; }
.day-card .skip-btn:hover { border-color:var(--danger,#e57373); color:var(--danger,#e57373); }

/* ===== 组间休息计时器 ===== */
.rest-timer-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--accent);padding:14px 20px;z-index:200;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,.61,.36,1);box-shadow:0 -4px 24px rgba(0,0,0,0.4);}
.rest-timer-bar.show{transform:translateY(0);}
.rest-timer-bar .rt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.rest-timer-bar .rt-label{font-size:13px;color:var(--text2);}
.rest-timer-bar .rt-num{font-size:32px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
.rest-timer-bar .rt-controls{display:flex;gap:8px;}
.rest-timer-bar .rt-btn{padding:6px 16px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s;}
.rest-timer-bar .rt-btn:hover{border-color:var(--accent);color:var(--accent);}
.rest-timer-bar .rt-btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600;}
.rest-timer-bar .rt-progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.rest-timer-bar .rt-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .95s linear;}
.rest-timer-bar.ending{animation:restTimerPulse .5s ease-out 3;}
@keyframes restTimerPulse{0%,100%{box-shadow:0 -4px 24px rgba(0,0,0,0.4);}50%{box-shadow:0 -4px 32px rgba(78,201,176,0.6);border-top:2px solid var(--accent);}}
.rest-timer-bar.paused .rt-progress-fill{transition:none;}
.rest-timer-bar.paused .rt-num{color:var(--warn);}

/* ===== Toast 提示 ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:12px 24px;font-size:14px;color:var(--accent);z-index:300;transition:transform .3s cubic-bezier(.22,.61,.36,1);box-shadow:0 4px 24px rgba(0,0,0,0.4);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ===== 换动作弹窗 ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:400;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:420px;width:90%;max-height:70vh;overflow-y:auto;transform:scale(0.9);transition:transform .2s;}
.modal-overlay.show .modal-box{transform:scale(1);}
.modal-title{font-size:16px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:14px;}
.swap-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.swap-item:hover{border-color:var(--accent);background:rgba(78,201,176,0.06);}
.swap-item .si-name{font-size:14px;font-weight:600;}
.swap-item .si-info{font-size:11px;color:var(--text2);margin-top:2px;}
.swap-item .si-equip{font-size:10px;color:var(--accent);background:rgba(78,201,176,0.12);border-radius:4px;padding:1px 6px;white-space:nowrap;}
.swap-item.current{opacity:0.4;cursor:default;}
.swap-item.current:hover{border-color:var(--border);background:transparent;}
.ex-swap-btn{font-size:11px;color:var(--text2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;cursor:pointer;background:transparent;margin-left:8px;transition:all .15s;}
.ex-swap-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ===== 周期大纲 ===== */
.cycle-bar{display:flex;align-items:center;gap:4px;margin-bottom:14px;}
.cycle-seg{flex:1;height:6px;border-radius:3px;background:var(--border);transition:background .3s;}
.cycle-seg.active{background:var(--accent);}
.cycle-seg.done{background:rgba(78,201,176,0.5);}
.cycle-seg.deload{background:var(--warn);}
.cycle-info{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2);margin-bottom:14px;}
.cycle-info .ci-label{font-weight:600;color:var(--accent);}
.cycle-overview-card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--border);}
.cycle-overview-card.deload{border-color:var(--warn);}
.cycle-overview-card .co-week{font-size:12px;color:var(--text2);margin-bottom:4px;}
.cycle-overview-card .co-focus{font-size:15px;font-weight:600;margin-bottom:6px;}
.cycle-overview-card .co-detail{font-size:12px;color:var(--text2);line-height:1.6;}
.cycle-overview-card.current{border-color:var(--accent);box-shadow:0 0 0 2px rgba(78,201,176,0.15);}
.cycle-overview-card .co-badge{display:inline-block;font-size:10px;border-radius:4px;padding:1px 6px;margin-left:6px;}
.cycle-overview-card .co-badge.now{background:var(--accent);color:var(--bg);font-weight:600;}
.cycle-overview-card .co-badge.deload{background:var(--warn);color:var(--bg);}

/* ===== 身体维度记录 ===== */
.measure-reminder-card{background:linear-gradient(135deg, var(--accent-light), var(--bg));border-radius:12px;padding:14px;border:1px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.measure-input-group{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.measure-input-group label{flex-shrink:0;width:70px;font-size:13px;color:var(--text2);margin:0;}
.measure-input-group input{flex:1;}
.measure-input-group .unit{font-size:12px;color:var(--text3);flex-shrink:0;}
.measure-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.measure-grid .mg-item{background:var(--bg);border-radius:8px;padding:10px;text-align:center;}
.measure-grid .mg-label{font-size:11px;color:var(--text2);margin-bottom:4px;}
.measure-grid .mg-value{font-size:18px;font-weight:700;color:var(--accent);}
.measure-grid .mg-change{font-size:10px;margin-top:2px;}
.measure-grid .mg-change.up{color:var(--danger);}
.measure-grid .mg-change.down{color:var(--accent);}
.measure-timeline-item{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:8px;border:1px solid var(--border);}
.measure-timeline-item .mt-date{font-size:12px;color:var(--text2);margin-bottom:6px;}
.measure-timeline-item .mt-data{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;}
.measure-timeline-item .mt-data .mt-cell{display:flex;flex-direction:column;}
.measure-timeline-item .mt-data .mt-cell .mtc-label{font-size:10px;color:var(--text3);}
.measure-timeline-item .mt-data .mt-cell .mtc-val{font-size:14px;font-weight:600;}
.measure-photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.measure-photo-grid .mp-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:3/4;background:var(--border);}
.measure-photo-grid .mp-item img{width:100%;height:100%;object-fit:cover;}
.measure-photo-grid .mp-item .mp-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);font-size:10px;color:#fff;padding:2px 6px;text-align:center;}
.measure-section-title{font-size:13px;font-weight:600;margin:16px 0 10px;color:var(--text);}
.photo-input-label{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:1px dashed var(--border);border-radius:8px;cursor:pointer;font-size:12px;color:var(--text2);transition:all .15s;}
.photo-input-label:hover{border-color:var(--accent);color:var(--accent);}
.photo-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.photo-preview .pp-item{position:relative;width:60px;height:80px;border-radius:6px;overflow:hidden;}
.photo-preview .pp-item img{width:100%;height:100%;object-fit:cover;}
.photo-preview .pp-remove{position:absolute;top:0;right:0;background:rgba(0,0,0,0.7);color:#fff;font-size:10px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0 0 0 6px;}

/* ===== 柱状图 ===== */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding:0 4px 24px;position:relative;overflow-x:auto;}
.bar-chart .bc-bar-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex-shrink:0;min-width:36px;height:100%;position:relative;}
.bar-chart .bc-bar{width:100%;max-width:32px;border-radius:6px 6px 0 0;transition:height .4s cubic-bezier(.22,.61,.36,1);position:relative;cursor:pointer;min-height:3px;}
.bar-chart .bc-bar.accent{background:var(--accent);}
.bar-chart .bc-bar.danger{background:var(--danger);}
.bar-chart .bc-bar.warn{background:var(--warn);}
.bar-chart .bc-bar.deload{background:var(--text2);}
.bar-chart .bc-value{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--text);white-space:nowrap;}
.bar-chart .bc-label{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:var(--text2);white-space:nowrap;}
.bar-chart .bc-axis{position:absolute;left:0;right:0;top:0;bottom:24px;pointer-events:none;}
.bar-chart .bc-axis-line{position:absolute;left:0;right:0;border-top:1px dashed var(--border);font-size:9px;color:var(--text3);}
.bar-chart .bc-axis-line span{position:absolute;left:0;top:-12px;color:var(--text3);font-size:9px;}

/* 多组柱对比（同一动作多周重量） */
.bar-group{display:flex;align-items:flex-end;gap:3px;height:100%;}
.bar-group .bc-bar{max-width:20px;}

/* ===== 周期化大纲 ===== */
.year-roadmap{position:relative;padding:8px 0 20px;}
.year-connector{position:absolute;left:20px;top:24px;bottom:24px;width:3px;background:var(--border);border-radius:2px;z-index:0;}
.year-quarter{position:relative;padding-left:52px;margin-bottom:24px;z-index:1;}
.year-dot{position:absolute;left:12px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--accent);z-index:2;}
.year-dot.done{background:var(--accent);}
.year-dot.deload{border-color:var(--warn);}
.year-dot.future{border-color:var(--text2);}
.year-quarter-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;}

.cycle-phase-tag.current{background:var(--accent);color:var(--bg);}
.cycle-phase-tag.done{background:var(--border);color:var(--text2);}
.cycle-phase-tag.future{background:transparent;border:1px solid var(--border);color:var(--text2);}
.cycle-phase-params{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
.cycle-phase-param{text-align:center;}
.cycle-phase-param .cpp-label{font-size:10px;color:var(--text3);margin-bottom:2px;}
.cycle-phase-param .cpp-val{font-size:14px;font-weight:700;color:var(--accent);}
.cycle-phase-desc{font-size:12px;color:var(--text2);line-height:1.6;}

.perio-track{margin-bottom:20px;}
.perio-track-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}

.perio-arrow:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10px 50%);}

.perio-arrow.strength{background:#e06c75;}
.perio-arrow.power{background:#ffaa00;}

// 动作库查找函数
function findExercise(id) {
  return EXERCISE_LIBRARY.find(function(e) { return e.id === id; });
}

// 按运动模式筛选
function findByPattern(pattern, minLevel, equipment) {
  return EXERCISE_LIBRARY.filter(function(e) {
    if (e.pattern !== pattern) return false;
    if (minLevel && e.minLevel > minLevel) return false;
    return true;
  });
}

// 按肌群筛选
function findByMuscle(muscle, minLevel) {
  return EXERCISE_LIBRARY.filter(function(e) {
    if (e.primary.indexOf(muscle) < 0 && e.secondary.indexOf(muscle) < 0) return false;
    if (minLevel && e.minLevel > minLevel) return false;
    return true;
  });
}

    { exerciseId: 'EX063', order: 6, sets: 3, reps: '10-12/侧', rest: 45, note: '核心' }
  ]
};

// 等级判定
function determineLevel(profile) {
  var months = profile.experienceMonths || 0;
  var level;
  if (months < 6) level = 1;
  else if (months < 18) level = 2;
  else level = 3;

  // 交叉验证
  if (profile.squat1RM && profile.bodyweight) {
    var ratio = profile.squat1RM / profile.bodyweight;
    if (level === 1 && ratio >= 1.0 && months >= 3) level = 2;
    if (level === 2 && ratio >= 1.5 && months >= 12) level = 3;
  }
  return level;
}

// 伤病过滤
function filterByContraindications(exerciseIds, conditions) {
  return exerciseIds.filter(function(id) {
    var ex = findExercise(id);
    if (!ex || !ex.contraindications) return true;
    for (var area in conditions) {
      if (conditions[area] && ex.contraindications[area]) {
        var contraindList = ex.contraindications[area];
        if (contraindList && contraindList.length > 0) {
          // 有伤病且有禁忌标记 -> 排除该动作
          return false;
        }
      }
    }
    return true;
  });
}

function findExerciseByName(name) {
  return EXERCISE_LIBRARY.find(function(e) { return e.name === name; });
}

// 获取训练模板
function getDayTemplate(dayName, level) {
  if (level === 1) {
    return LEVEL1_TEMPLATES[dayName] || LEVEL1_TEMPLATES['全身A'];
  } else {
    return LEVEL2_TEMPLATES[dayName] || LEVEL2_TEMPLATES['推Push'];
  }
}

// 查找同模式、同主肌群的替代动作
function findAlternative(exerciseId, level) {
  var ex = findExercise(exerciseId);
  if (!ex) return exerciseId;

  // 同pattern + 同主肌群 + 同equipment + 同难度等级
  var candidates = EXERCISE_LIBRARY.filter(function(e) {
    return e.id !== exerciseId &&
           e.pattern === ex.pattern &&
           e.primary.join(',') === ex.primary.join(',') &&
           e.minLevel <= level &&
           e.difficulty <= level + 1;
  });

  if (candidates.length === 0) {
    // 降级：同pattern即可
    candidates = EXERCISE_LIBRARY.filter(function(e) {
      return e.id !== exerciseId && e.pattern === ex.pattern && e.minLevel <= level;
    });
  }

  if (candidates.length === 0) return exerciseId;
  return candidates[Math.floor(Math.random() * candidates.length)].id;
}

// 随机替换模板中的部分动作（主项保留，辅助项随机替换）
function shuffleTemplate(template, level) {
  return template.map(function(ex) {
    // 主项（order 1-2）保留不变，辅助项有50%概率替换
    if (ex.order <= 2) return ex;
    if (Math.random() < 0.5) return ex;

    var altId = findAlternative(ex.exerciseId, level);
    if (altId === ex.exerciseId) return ex;

    var altEx = findExercise(altId);
    if (!altEx) return ex;

    // 保留原模板的组数/次数/休息，只替换动作ID和note
    return {
      exerciseId: altId,
      order: ex.order,
      sets: ex.sets,
      reps: ex.reps,
      rest: ex.rest,
      note: ex.note.replace(/：.*/, '：' + altEx.primary.join('·'))
    };
  });
}

// 生成周计划
function generatePlan(profile) {
  var level = determineLevel(profile);
  var split = SPLIT_TEMPLATES[profile.daysPerWeek] || SPLIT_TEMPLATES[3];
  var weekDays = ['第1天', '第2天', '第3天', '第4天', '第5天', '第6天', '第7天'];
  
  // 安排训练日和休息日
  var dayPlan = [];
  var trainingDays = split.days;
  var restCount = 7 - trainingDays.length;
  
  // 训练日分配策略
  var dayPattern;
  if (trainingDays.length === 2) {
    dayPattern = [0, 3]; // 第1天、第4天
  } else if (trainingDays.length === 3) {
    dayPattern = [0, 2, 4]; // 第1、3、5天
  } else if (trainingDays.length === 4) {
    dayPattern = [0, 1, 3, 4]; // 第1、2、4、5天
  } else if (trainingDays.length === 5) {
    dayPattern = [0, 1, 2, 3, 4]; // 第1-5天
  } else {
    dayPattern = [0, 1, 2, 3, 4, 5]; // 第1-6天
  }
  
  var templateIndex = 0;
  for (var i = 0; i < 7; i++) {
    if (dayPattern.indexOf(i) >= 0 && templateIndex < trainingDays.length) {
      var dayName = trainingDays[templateIndex % trainingDays.length];
      var template = getDayTemplate(dayName, level);
      var shuffled = shuffleTemplate(template, level);
      dayPlan.push({
        dayName: weekDays[i],
        dayIndex: i,
        type: dayName,
        isRest: false,
        exercises: JSON.parse(JSON.stringify(shuffled))
      });
      templateIndex++;
    } else {
      dayPlan.push({
        dayName: weekDays[i],
        dayIndex: i,
        type: '休息',
        isRest: true,
        exercises: []
      });
    }
  }
  
  return {
    id: 'plan_' + Date.now(),
    version: '1.0',
    level: level,
    splitType: split.type,
    daysPerWeek: profile.daysPerWeek,
    createdAt: new Date().toISOString(),
    weekPlan: dayPlan,
    profile: profile,
    cycleWeek: 1,          // 当前周期第几周 (1-4)
    cycleStart: new Date().toISOString(),  // 周期开始日期
    weekStartDate: new Date().toISOString(), // 当前周开始日期
    cycleCount: 0,         // 已完成的完整周期数
    trackOverride: null,   // 手动选择的路线（null=自动匹配，0/1/2=手动指定）
    completedDays: [],     // 本周已完成的训练日 idx
    skippedDays: []        // 本周请假的训练日 idx（顺延到下周）
  };
}

// 重量推荐算法
function recommendWeight(lastLog, exercise, level) {
  if (!lastLog || !lastLog.sets || lastLog.sets.length === 0) {
    // 无历史记录 -> 给保守起始重量
    var startWeight = exercise.equipment === 'barbell' ? 20 :
                      exercise.equipment === 'dumbbell' ? 5 :
                      exercise.equipment === 'machine' ? 20 : 0;
    return {
      weight: startWeight,
      targetReps: exercise.reps.split('-')[0],
      message: '首次尝试，建议从轻重量开始，注重动作质量'
    };
  }
  
  var validSets = lastLog.sets.filter(function(s) { return s.weight != null && !isNaN(s.weight); });
  if (validSets.length === 0) {
    // 有记录但没填重量 -> 给保守起始重量
    var fallbackWeight = exercise.equipment === 'barbell' ? 20 :
                         exercise.equipment === 'dumbbell' ? 5 :
                         exercise.equipment === 'machine' ? 20 : 0;
    return {
      weight: fallbackWeight,
      targetReps: exercise.reps.split('-')[0],
      message: '上次未记录重量，建议从轻重量开始重新校准'
    };
  }
  var lastWeight = validSets[0].weight;
  var lastReps = validSets.map(function(s) { return s.reps != null ? s.reps : 0; });
  var repRange = exercise.reps.split('-').map(function(n) { return parseInt(n); });
  if (repRange.length === 1) {
    repRange = [parseInt(exercise.reps), parseInt(exercise.reps)];
  }
  var bottom = repRange[0], top = repRange[1] || repRange[0];
  
  var allHitTop = lastReps.every(function(r) { return r >= top; });
  var allHitBottom = lastReps.every(function(r) { return r >= bottom; });
  var anyMissed = lastReps.some(function(r) { return r < bottom; });
  
  if (allHitTop) {
    var increment = exercise.equipment === 'dumbbell' ? 2.5 :
                    exercise.equipment === 'barbell' ? 2.5 : 5;
    return {
      weight: lastWeight + increment,
      targetReps: bottom,
      message: '上次每组都达到' + top + '次，加重' + increment + 'kg！目标' + bottom + '次起'
    };
  } else if (allHitBottom) {
    var minReps = Math.min.apply(null, lastReps);
    return {
      weight: lastWeight,
      targetReps: minReps + 1,
      message: '保持重量，每组多做1次'
    };
  } else if (anyMissed) {
    if (lastLog.consecutiveFail >= 2) {
      return {
        weight: Math.round(lastWeight * 0.9),
        targetReps: bottom,
        message: '连续2次未完成，降重10%重新积累'
      };
    } else {
      return {
        weight: lastWeight,
        targetReps: bottom,
        message: '保持重量，继续尝试完成目标次数'
      };
    }
  }
  
  return { weight: lastWeight, targetReps: bottom, message: '保持上次设定' };
}

// 1RM估算
function estimate1RM(weight, reps) {
  if (reps <= 1) return weight;
  var epley = weight * (1 + reps / 30);
  var brzycki = weight * 36 / (37 - reps);
  return Math.round((epley + brzycki) / 2);
}

<script>
// ===== 状态管理 =====
var state = {
  profile: null,
  plan: null,

  measurements: [], // 身体维度记录

};

// ===== 组间休息计时器 =====
var restTimer = {
  intervalId: null,
  totalSec: 0,
  remainingSec: 0,
  paused: false
};

function startRestTimer(seconds) {
  // 如果已有计时器在跑，先清除
  stopRestTimer();

  restTimer.totalSec = seconds;
  restTimer.remainingSec = seconds;
  restTimer.paused = false;

  var bar = document.getElementById('restTimerBar');
  var numEl = document.getElementById('rtNum');
  var fillEl = document.getElementById('rtProgressFill');
  var pauseBtn = document.getElementById('rtPause');

  bar.classList.remove('paused', 'ending');
  pauseBtn.textContent = '暂停';

  updateRestTimerDisplay();
  bar.classList.add('show');

  restTimer.intervalId = setInterval(function() {
    if (restTimer.paused) return;
    restTimer.remainingSec--;
    if (restTimer.remainingSec <= 0) {
      restTimer.remainingSec = 0;
      updateRestTimerDisplay();
      finishRestTimer();
    } else {
      updateRestTimerDisplay();
    }
  }, 1000);
}

function updateRestTimerDisplay() {
  var numEl = document.getElementById('rtNum');
  var fillEl = document.getElementById('rtProgressFill');
  var m = Math.floor(restTimer.remainingSec / 60);
  var s = restTimer.remainingSec % 60;
  numEl.textContent = m > 0 ? (m + ':' + String(s).padStart(2, '0')) : s;
  var pct = restTimer.totalSec > 0 ? (restTimer.remainingSec / restTimer.totalSec * 100) : 0;
  fillEl.style.width = pct + '%';
}

function finishRestTimer() {
  clearInterval(restTimer.intervalId);
  restTimer.intervalId = null;

  // 提示音
  try {
    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var playBeep = function(freq, delay) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + 0.3);
    };
    playBeep(880, 0);
    playBeep(880, 0.4);
  } catch(e) {}

  // 震动
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

  // 视觉脉冲
  var bar = document.getElementById('restTimerBar');
  bar.classList.add('ending');

  // 2秒后自动收起
  setTimeout(function() {
    stopRestTimer();
  }, 2500);
}

function stopRestTimer() {
  if (restTimer.intervalId) {
    clearInterval(restTimer.intervalId);
    restTimer.intervalId = null;
  }
  restTimer.remainingSec = 0;
  restTimer.paused = false;
  var bar = document.getElementById('restTimerBar');
  bar.classList.remove('show', 'ending', 'paused');
  var pauseBtn = document.getElementById('rtPause');
  if (pauseBtn) pauseBtn.textContent = '暂停';
}

function pauseRestTimer() {
  if (!restTimer.intervalId) return;
  restTimer.paused = !restTimer.paused;
  var bar = document.getElementById('restTimerBar');
  var pauseBtn = document.getElementById('rtPause');
  if (restTimer.paused) {
    bar.classList.add('paused');
    pauseBtn.textContent = '继续';
  } else {
    bar.classList.remove('paused');
    pauseBtn.textContent = '暂停';
  }
}

function addRestTime(seconds) {
  restTimer.remainingSec += seconds;
  restTimer.totalSec += seconds;
  updateRestTimerDisplay();
  // 如果计时器已结束但在ending状态，恢复运行
  if (!restTimer.intervalId && restTimer.remainingSec > 0) {
    var bar = document.getElementById('restTimerBar');
    bar.classList.remove('ending');
    restTimer.intervalId = setInterval(function() {
      if (restTimer.paused) return;
      restTimer.remainingSec--;
      if (restTimer.remainingSec <= 0) {
        restTimer.remainingSec = 0;
        updateRestTimerDisplay();
        finishRestTimer();
      } else {
        updateRestTimerDisplay();
      }
    }, 1000);
  }
}

  }));

function loadState() {
  var raw = localStorage.getItem('fitnessBuddy');
  if (raw) {
    try {
      var data = JSON.parse(raw);
      state.profile = data.profile;
      state.plan = data.plan;
      state.logs = data.logs || [];
      state.measurements = data.measurements || [];
      // 兼容旧版plan：补全周期字段
      if (state.plan) {
        if (!state.plan.cycleWeek) state.plan.cycleWeek = 1;
        if (!state.plan.completedDays) state.plan.completedDays = [];
        if (!state.plan.cycleStart) state.plan.cycleStart = state.plan.createdAt || new Date().toISOString();
        if (state.plan.cycleCount === undefined) state.plan.cycleCount = 0;
        if (state.plan.trackOverride === undefined) state.plan.trackOverride = null;
        if (!state.plan.skippedDays) state.plan.skippedDays = [];
        if (!state.plan.weekStartDate) state.plan.weekStartDate = state.plan.cycleStart || state.plan.createdAt || new Date().toISOString();
      }
    } catch(e) { console.error('Load failed', e); }
  }
}

function renderQuiz() {

  }

  step.fields.forEach(function(f) {
    html += '<div style="margin-bottom:16px;">';
    html += '<label>' + f.label + '</label>';
    if (f.type === 'choice') {
      f.options.forEach(function(opt) {
        var sel = state.profile && state.profile[f.key] !== undefined && String(state.profile[f.key]) === String(opt.val) ? ' selected' : '';
        html += '<div class="quiz-option' + sel + '" data-field="' + f.key + '" data-val="' + opt.val + '">';

        if (opt.desc) html += '<div class="opt-desc">' + opt.desc + '</div>';
        html += '</div>';
      });
    } else {

    }
    html += '</div>';
  });

  html += '<div class="quiz-nav">';

    html += '<button class="btn btn-secondary" id="quizPrev">上一步</button>';
  } else {
    html += '<div></div>';
  }

    html += '<button class="btn btn-primary" id="quizNext">下一步</button>';
  } else {
    html += '<button class="btn btn-primary" id="quizFinish">生成训练计划</button>';
  }
  html += '</div>';

  document.getElementById('quizContent').innerHTML = html;

  // 绑定事件
  document.querySelectorAll('.quiz-option').forEach(function(opt) {
    opt.addEventListener('click', function() {
      var field = this.dataset.field;
      var val = this.dataset.val;
      // 处理数值类型
      if (val === 'true') val = true;
      else if (val === 'false') val = false;
      else if (!isNaN(val) && val !== '') val = Number(val);

      state.profile[field] = val;

// ===== NSCA-CPT 肌肥大周期化模型 =====
function renderYearRoadmap() {
  var info = getCycleInfo();
  var cw = info ? info.currentWeek : 1;

  var completedCycles = state.plan ? (state.plan.cycleCount || 0) : 0;

  // 肌肥大训练参数
  var paramLib = {
    hypertrophy:{ name: '肌肥大', en: 'Hypertrophy', reps: '8-12', sets: '3-4', intensity: '67-75% 1RM', rest: '60-90s', rpe: '7-8', color: 'hypertrophy' },
    strength:  { name: '肌力',   en: 'Muscular Strength', reps: '4-6', sets: '3-5', intensity: '80-88% 1RM', rest: '2-3min', rpe: '8-9', color: 'strength' }
  };

  // 肌肥大周期化路线
  var track = {
    label: '肌肥大周期化路线',
    sub: '以肌肥大为核心，穿插肌力阶段打破适应平台',
    focusNote: '肌肥大为主轨，每次插入2-3周肌力阶段打破适应，回到肌肥大时能使用更大重量刺激肌肉生长',
    phases: [
      { type: 'hypertrophy', weeks: 4 },
      { type: 'strength',    weeks: 3 },
      { type: 'hypertrophy', weeks: 4 },
      { type: 'strength',    weeks: 2 },
      { type: 'hypertrophy', weeks: 3 }
    ]
  };

  // 计算当前在路线中的位置
  var totalWeeksInTrack = 0;
  track.phases.forEach(function(p) { totalWeeksInTrack += p.weeks; });
  var elapsedWeeks = completedCycles * 4 + (cw - 1);
  var trackPos = elapsedWeeks % totalWeeksInTrack;
  var trackRound = Math.floor(elapsedWeeks / totalWeeksInTrack) + 1;

  var currentPhaseIdx = 0;
  var acc = 0;
  for (var i = 0; i < track.phases.length; i++) {
    acc += track.phases[i].weeks;
    if (trackPos < acc) { currentPhaseIdx = i; break; }
  }

  var html = '';

  // === 顶部说明 ===
  html += '<div class="card">';
  html += '<div class="card-title">肌肥大周期化路线</div>';
  html += '<div style="font-size:13px;color:var(--text2);line-height:1.8;">';
  html += '根据 NSCA-CPT 周期化原则，肌肥大训练不是一成不变地做8-12次。';
  html += '每4周肌肥大阶段后插入2-3周肌力阶段，给神经系统新的刺激，打破适应平台。';
  html += '回到肌肥大时能使用更大重量，从而产生更强的代谢压力和机械张力，促进肌肉生长。';
  html += '</div>';
  if (state.profile) {
    html += '<div style="margin-top:8px;font-size:12px;color:var(--text3);">';
    html += '已训练 ' + elapsedWeeks + ' 周 · 第' + trackRound + '轮循环 · 当前在第' + (currentPhaseIdx + 1) + '阶段';
    html += '</div>';
  }
  html += '</div>';

  // === 图例 ===
  html += '<div class="perio-legend">';
  html += '<div class="pl-item"><div class="pl-dot" style="background:#a78bfa;"></div>肌肥大</div>';
  html += '<div class="pl-item"><div class="pl-dot" style="background:#e06c75;"></div>肌力</div>';
  html += '</div>';

  // === 箭头流程图 ===
  html += '<div class="card">';
  html += '<div class="perio-track-header">';
  html += '<div class="perio-track-label">' + track.label + '</div>';
  html += '</div>';
  html += '<div class="perio-track-sub">' + track.sub + '</div>';

  html += '<div class="perio-track">';
  html += '<div class="perio-arrows">';

  var phaseStartWeek = 0;
  track.phases.forEach(function(p, pIdx) {
    var params = paramLib[p.type];
    var isDone = pIdx < currentPhaseIdx;
    var isCurrent = pIdx === currentPhaseIdx;

    var cls = 'perio-arrow ' + params.color;
    if (isDone) cls += ' done';
    if (isCurrent) cls += ' current';

    html += '<div class="' + cls + '">';
    html += '<div class="pa-weeks">' + p.weeks + 'w</div>';
    html += '<div class="pa-type">' + params.name + '</div>';
    html += '<div class="pa-num">W' + (phaseStartWeek + 1) + '-' + (phaseStartWeek + p.weeks) + '</div>';
    html += '</div>';

    phaseStartWeek += p.weeks;
  });

// ===== 请假/推迟训练 =====
function skipDay(dayIdx) {
  if (!state.plan) return;
  if (!state.plan.skippedDays) state.plan.skippedDays = [];
  if (state.plan.skippedDays.indexOf(dayIdx) < 0) {
    state.plan.skippedDays.push(dayIdx);
    saveState();
    var dayName = state.plan.weekPlan[dayIdx].dayName;
    var dayType = state.plan.weekPlan[dayIdx].type;
    showToast(dayName + ' ' + dayType + ' 已请假，训练内容顺延至下周');
    renderDashboard();
    checkWeekCompletion();
  }
}

function unskipDay(dayIdx) {
  if (!state.plan || !state.plan.skippedDays) return;
  var idx = state.plan.skippedDays.indexOf(dayIdx);
  if (idx >= 0) {
    state.plan.skippedDays.splice(idx, 1);
    saveState();
    renderDashboard();
  }
}

function checkWeekCompletion() {
  if (!state.plan) return;
  var trainingDays = state.plan.weekPlan.filter(function(d) { return !d.isRest; });
  var completedDays = state.plan.completedDays || [];
  var skippedDays = state.plan.skippedDays || [];

  // 统计本周已处理的天数（完成 + 请假）
  var doneCount = 0;
  trainingDays.forEach(function(day) {
    var dayIdx = state.plan.weekPlan.indexOf(day);
    if (completedDays.indexOf(dayIdx) >= 0 || skippedDays.indexOf(dayIdx) >= 0) doneCount++;
  });

  if (doneCount >= trainingDays.length) {
    // 本周全部处理完（完成或请假），滚动到下一周
    advanceToNextWeek();
  }
}

function advanceToNextWeek() {
  var cw = state.plan.cycleWeek || 1;
  var skippedDays = state.plan.skippedDays || [];

  if (cw < 4) {
    // 进入下一周
    state.plan.cycleWeek = cw + 1;
    state.plan.completedDays = [];
    state.plan.weekStartDate = new Date().toISOString();

    // 如果是第4周（减载周），降低重量
    if (state.plan.cycleWeek === 4) {
      applyDeload();
    } else {
      // 第2、3周：尝试渐进超负荷
      applyProgressiveOverload();
    }

    // 请假的训练日顺延到下周：重新标记为未完成，保留训练内容
    // skippedDays 清空，因为新的一周开始，这些日的内容已经在weekPlan中了
    var skippedCount = skippedDays.length;
    state.plan.skippedDays = [];

    saveState();
    var msg = '本周训练全部处理完！进入' + getCycleInfo().weekName;
    if (skippedCount > 0) {
      msg += '（' + skippedCount + '天请假已顺延至本周）';
    }
    showToast(msg);
  } else {
    // 完成4周周期，进入新周期第1周
    state.plan.cycleWeek = 1;
    state.plan.completedDays = [];
    state.plan.skippedDays = [];
    state.plan.cycleStart = new Date().toISOString();
    state.plan.weekStartDate = new Date().toISOString();
    state.plan.cycleCount = (state.plan.cycleCount || 0) + 1;

    // 重新生成计划（保留profile，新周期辅助动作轮换）
    var newPlan = generatePlan(state.profile);
    state.plan.weekPlan = newPlan.weekPlan;
    state.plan.id = newPlan.id;
    state.plan.createdAt = newPlan.createdAt;

    saveState();
    showToast('4周周期完成！新周期已开始');
  }
}

function applyProgressiveOverload() {
  // 获取最近一次训练记录中各动作的最大重量
  state.plan.weekPlan.forEach(function(day) {
    if (day.isRest) return;
    day.exercises.forEach(function(exTpl) {
      // 查找该动作的历史记录
      var lastLog = state.logs.filter(function(l) {
        return l.exercises.some(function(e) { return e.exerciseId === exTpl.exerciseId; });
      }).pop();

      if (lastLog) {
        var lastEx = lastLog.exercises.find(function(e) { return e.exerciseId === exTpl.exerciseId; });
        if (lastEx && lastEx.sets && lastEx.sets.length > 0) {
          var maxWeight = 0;
          lastEx.sets.forEach(function(s) { if (s.weight && s.weight > maxWeight) maxWeight = s.weight; });

          // 如果上一周能完成目标次数上限，加重2.5kg
          var topReps = parseInt(exTpl.reps.split('-')[1] || exTpl.reps.split('-')[0]);
          var achievedTopReps = false;
          lastEx.sets.forEach(function(s) {
            if (s.reps && s.reps >= topReps && s.weight === maxWeight) achievedTopReps = true;
          });

          if (achievedTopReps && maxWeight > 0) {
            // 在exTpl上标记建议加重
            exTpl.suggestedIncrease = 2.5;
          }
        }
      }
    });
  });
}

function applyDeload() {
  // 减载周：所有动作组数-1（最少2组）
  state.plan.weekPlan.forEach(function(day) {
    if (day.isRest) return;
    day.exercises.forEach(function(exTpl) {
      if (exTpl.sets > 2) exTpl.sets = exTpl.sets - 1;
      exTpl.isDeload = true;
    });
  });
}

// ===== 周计划看板 =====
function renderDashboard() {
  if (!state.plan) {
    showPage('quiz');
    renderQuiz();
    return;
  }

  var levelText = state.plan.level === 1 ? 'Level 1 初级' : state.plan.level === 2 ? 'Level 2 中级' : 'Level 3 高级';
  var info = getCycleInfo();
  document.getElementById('weekTitle').textContent = info ? info.weekName + ' · 训练计划' : '本周训练计划';
  document.getElementById('weekSubtitle').textContent = levelText + ' · ' + state.plan.daysPerWeek + '天/周 · ' + state.profile.goal;

  // 周期进度条
  var cycleBar = document.getElementById('cycleProgressBar');
  if (cycleBar) cycleBar.innerHTML = renderCycleBar();

  // 计算今天是周计划的第几天（基于weekStartDate）
  var weekStart = new Date(state.plan.weekStartDate || state.plan.cycleStart || state.plan.createdAt);
  var now = new Date();
  var diffMs = now.getTime() - weekStart.getTime();
  var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  var today = Math.max(0, Math.min(6, diffDays)); // 0-6，限制在0-6范围内

  var html = '';
  state.plan.weekPlan.forEach(function(day, idx) {
    var isToday = idx === today;
    var isDone = (state.plan.completedDays || []).indexOf(idx) >= 0;

    var classes = 'day-card';
    if (day.isRest) classes += ' rest';
    if (isToday) classes += ' today';

    var skippedDays = state.plan.skippedDays || [];
    var isSkipped = skippedDays.indexOf(idx) >= 0;
    if (isSkipped) classes += ' skipped';

    html += '<div class="' + classes + '" data-day="' + idx + '">';
    html += '<div class="day-name">' + day.dayName + (isToday ? ' · 今天' : '') + '</div>';
    if (day.isRest) {
      html += '<div class="day-type rest">休息</div>';
      html += '<div class="ex-count">主动恢复</div>';
    } else {
      html += '<div class="day-type">' + day.type + '</div>';
      html += '<div class="ex-count">' + day.exercises.length + '个动作</div>';
      if (isDone) {
        html += '<div class="done-badge">已完成 ✓</div>';
      } else if (isSkipped) {
        html += '<div class="skip-badge">已请假（顺延下周）</div>';
        html += '<button class="skip-btn" onclick="event.stopPropagation();unskipDay(' + idx + ')">取消请假</button>';
      } else {
        html += '<button class="skip-btn" onclick="event.stopPropagation();skipDay(' + idx + ')">请假/推迟</button>';
      }
    }
    html += '</div>';
  });
  document.getElementById('weekDashboard').innerHTML = html;

  document.querySelectorAll('.day-card[data-day]').forEach(function(card) {
    card.addEventListener('click', function() {
      var dayIdx = parseInt(this.dataset.day);
      if (!state.plan.weekPlan[dayIdx].isRest) {
        state.clickedDayIdx = dayIdx;
        state.scrollPosition = window.scrollY;
        openTraining(dayIdx);
      }
    });
  });

  // 返回后恢复滚动位置并高亮之前点击的卡片
  if (state.clickedDayIdx !== null) {
    var clickedCard = document.querySelector('.day-card[data-day="' + state.clickedDayIdx + '"]');
    if (clickedCard) {
      clickedCard.classList.add('just-returned');
      setTimeout(function() {
        window.scrollTo(0, state.scrollPosition || 0);
        setTimeout(function() {
          clickedCard.classList.remove('just-returned');
        }, 2000);
      }, 50);
    }
  }

  // 更新底部提示：本周进度摘要
  var tipEl = document.getElementById('todayTip');
  if (tipEl) {
    var trainingDays2 = state.plan.weekPlan.filter(function(d) { return !d.isRest; });
    var completedCount = (state.plan.completedDays || []).filter(function(idx) {
      return trainingDays2.some(function(d) { return state.plan.weekPlan.indexOf(d) === idx; });
    }).length;
    var skippedCount = (state.plan.skippedDays || []).filter(function(idx) {
      return trainingDays2.some(function(d) { return state.plan.weekPlan.indexOf(d) === idx; });
    }).length;
    var remainingCount = trainingDays2.length - completedCount - skippedCount;
    var tipHtml = '<div style="font-size:13px;color:var(--text2);line-height:2;">';
    tipHtml += '本周进度：已完成 <b style="color:var(--accent);">' + completedCount + '</b>';
    if (skippedCount > 0) tipHtml += ' · 请假 <b style="color:var(--text2);">' + skippedCount + '</b>';
    tipHtml += ' · 待训练 <b>' + remainingCount + '</b> / 共 ' + trainingDays2.length + ' 天';
    if (skippedCount > 0) tipHtml += '<br><span style="font-size:12px;">请假的训练日内容将顺延至下周</span>';
    tipHtml += '</div>';
    tipEl.innerHTML = tipHtml;
  }

  // 维度测量提醒
  var measureReminder = document.getElementById('measureReminder');
  if (measureReminder) {
    var reminder = getMeasureReminder();
    if (reminder.needed) {
      measureReminder.style.display = 'block';
      var badgeText = reminder.daysSince === null ? '首次测量' : ('已' + reminder.daysSince + '天');
      measureReminder.innerHTML = '<div class="measure-reminder-card" onclick="document.getElementById(\'navMeasure\').click()" style="cursor:pointer;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<div style="font-size:24px;">📏</div>' +
          '<div style="flex:1;">' +
            '<div style="font-size:13px;font-weight:600;color:var(--text);">该量维度了</div>' +
            '<div style="font-size:11px;color:var(--text2);margin-top:2px;">' + reminder.reason + '</div>' +
          '</div>' +
          '<div style="font-size:11px;color:var(--accent);background:var(--accent-light);padding:4px 10px;border-radius:12px;font-weight:600;">' + badgeText + '</div>' +
        '</div>' +
      '</div>';
    } else {
      measureReminder.style.display = 'none';
    }
  }
}

// 节奏转文字描述
function tempoToText(tempo) {
  if (tempo === '持续') return '持续发力，匀速完成';
  if (tempo === '爆发') return '爆发发力，快速推起';
  var parts = tempo.split('-');
  if (parts.length === 2) {
    return '下放' + parts[0] + '秒，推起' + parts[1] + '秒';
  }
  if (parts.length === 4) {
    var desc = '下放' + parts[0] + '秒';
    if (parts[1] !== '0') desc += '，底部停' + parts[1] + '秒';
    desc += '，推起' + parts[2] + '秒';
    if (parts[3] !== '0') desc += '，顶部停' + parts[3] + '秒';
    return desc;
  }
  return tempo;
}

// 预估训练总时间
function estimateTrainingTime(day) {
  var warmupMin = 7;
  var stretchMin = 7;
  var setupPerExercise = 60;
  var liftPerSet = 40;

  var totalSeconds = (warmupMin + stretchMin) * 60;
  day.exercises.forEach(function(ex) {
    totalSeconds += ex.sets * (liftPerSet + ex.rest);
    totalSeconds += setupPerExercise;
  });

  return Math.round(totalSeconds / 60);
}

// 从数组中随机抽取n个元素
function pickRandom(arr, n) {
  var pool = arr.slice();
  var result = [];
  for (var i = 0; i < n && pool.length > 0; i++) {
    var idx = Math.floor(Math.random() * pool.length);
    result.push(pool.splice(idx, 1)[0]);
  }
  return result;
}

// ===== 换动作 =====
var EQUIP_LABELS = { dumbbell: '哑铃', barbell: '杠铃', machine: '器械', bodyweight: '自重', kettlebell: '壶铃', band: '弹力带' };

function openSwapModal(exIdx) {
  var day = state.plan.weekPlan[state.currentDay];
  var exTpl = day.exercises[exIdx];
  var currentEx = findExercise(exTpl.exerciseId);
  if (!currentEx) return;

  document.getElementById('swapTitle').textContent = '替换：' + currentEx.name;
  document.getElementById('swapSub').textContent = '同肌群 · 同模式 · 可选替代动作';

  // 查找替代动作：同pattern + 同主肌群
  var candidates = EXERCISE_LIBRARY.filter(function(e) {
    return e.id !== exTpl.exerciseId &&
           e.pattern === currentEx.pattern &&
           e.primary.join(',') === currentEx.primary.join(',') &&
           e.minLevel <= state.plan.level;
  });

  // 降级：同pattern即可
  if (candidates.length === 0) {
    candidates = EXERCISE_LIBRARY.filter(function(e) {
      return e.id !== exTpl.exerciseId && e.pattern === currentEx.pattern && e.minLevel <= state.plan.level;
    });
  }

  // 再降级：同主肌群
  if (candidates.length === 0) {
    candidates = EXERCISE_LIBRARY.filter(function(e) {
      return e.id !== exTpl.exerciseId && e.primary.join(',') === currentEx.primary.join(',') && e.minLevel <= state.plan.level;
    });
  }

  var listHtml = '';

  // 当前动作
  listHtml += '<div class="swap-item current">';
  listHtml += '<div><div class="si-name">' + currentEx.name + '（当前）</div>';
  listHtml += '<div class="si-info">' + currentEx.primary.join('·') + ' / ' + currentEx.pattern + '</div></div>';
  listHtml += '<span class="si-equip">' + (EQUIP_LABELS[currentEx.equipment] || currentEx.equipment) + '</span>';
  listHtml += '</div>';

  candidates.forEach(function(c) {
    listHtml += '<div class="swap-item" data-swap-to="' + c.id + '" data-ex-idx="' + exIdx + '">';
    listHtml += '<div><div class="si-name">' + c.name + '</div>';
    listHtml += '<div class="si-info">' + c.primary.join('·') + (c.secondary.length ? ' / ' + c.secondary.join('·') : '') + '</div></div>';
    listHtml += '<span class="si-equip">' + (EQUIP_LABELS[c.equipment] || c.equipment) + '</span>';
    listHtml += '</div>';
  });

  if (candidates.length === 0) {
    listHtml += '<div style="font-size:13px;color:var(--text2);text-align:center;padding:20px;">没有找到合适的替代动作</div>';
  }

  document.getElementById('swapList').innerHTML = listHtml;
  document.getElementById('swapModal').classList.add('show');

  // 绑定选择
  document.querySelectorAll('.swap-item[data-swap-to]').forEach(function(item) {
    item.addEventListener('click', function() {
      var newId = this.dataset.swapTo;
      var idx = parseInt(this.dataset.exIdx);
      swapExercise(idx, newId);
      document.getElementById('swapModal').classList.remove('show');
    });
  });
}

function swapExercise(exIdx, newExerciseId) {
  var day = state.plan.weekPlan[state.currentDay];
  var oldEx = findExercise(day.exercises[exIdx].exerciseId);
  var newEx = findExercise(newExerciseId);
  if (!newEx) return;

  // 替换plan中的动作ID
  day.exercises[exIdx].exerciseId = newExerciseId;
  day.exercises[exIdx].note = day.exercises[exIdx].note.replace(/：.*/, '：' + newEx.primary.join('·'));

  // 替换currentTrainingData
  if (state.currentTrainingData && state.currentTrainingData.exercises[exIdx]) {
    state.currentTrainingData.exercises[exIdx].exerciseId = newExerciseId;
    state.currentTrainingData.exercises[exIdx].name = newEx.name;
    state.currentTrainingData.exercises[exIdx].sets = [];
  }

  saveState();
  showToast('已替换为：' + newEx.name);

  // 重新渲染训练卡
  openTraining(state.currentDay);
}

// ===== 完成训练 -> 总结 =====
function finishTraining() {
  var log = state.currentTrainingData;
  log.completedAt = new Date().toISOString();
  log.timeSlot = state.currentTimeslot;
  log.cycleWeek = state.plan.cycleWeek || 1;
  state.logs.push(log);

  // 记录本周已完成的天
  if (!state.plan.completedDays) state.plan.completedDays = [];
  if (state.plan.completedDays.indexOf(state.currentDay) < 0) {
    state.plan.completedDays.push(state.currentDay);
  }

  saveState();

  // 检查是否本周全部完成 → 自动滚动到下一周
  checkWeekCompletion();

  // 统计
  var totalSets = 0, totalReps = 0, totalVolume = 0;
  var completedExercises = 0;
  log.exercises.forEach(function(ex) {
    var hasData = false;
    ex.sets.forEach(function(s) {
      if (s.weight && s.reps) {
        totalSets++;
        totalReps += s.reps;
        totalVolume += s.weight * s.reps;
        hasData = true;
      }
    });
    if (hasData) completedExercises++;
  });

  // 鼓励语
  var encouragement = generateEncouragement(log, completedExercises);

  // 营养建议（按时段）
  var nutrition = generateNutritionAdvice({ type: log.type }, state.profile.bodyweight, state.currentTimeslot);

  // 时段标签
  var tsLabels = { early: '早起训练', noon: '午间训练', evening: '晚间训练' };
  var tsLabel = tsLabels[state.currentTimeslot] || '';

  var html = '';

  // 鼓励语
  html += '<div class="encourage-box">';
  html += '<div class="enc-text">' + encouragement + '</div>';
  html += '</div>';

  // 统计
  html += '<div class="summary-stats">';
  html += '<div class="summary-stat"><div class="stat-num">' + completedExercises + '</div><div class="stat-label">完成动作</div></div>';
  html += '<div class="summary-stat"><div class="stat-num">' + totalSets + '</div><div class="stat-label">总组数</div></div>';
  html += '<div class="summary-stat"><div class="stat-num">' + totalVolume + '</div><div class="stat-label">总容量(kg)</div></div>';
  html += '</div>';

  // 营养建议
  html += '<div class="card">';
  html += '<div class="card-title">练后营养建议 · ' + tsLabel + '</div>';
  html += '<div class="nutrition-card">';
  html += '<div class="macro">';
  html += '<div class="macro-item protein"><div class="macro-num">' + nutrition.protein + '</div><div class="macro-unit">g 蛋白质</div></div>';
  html += '<div class="macro-item carb"><div class="macro-num">' + nutrition.carb + '</div><div class="macro-unit">g 碳水</div></div>';
  html += '<div class="macro-item"><div class="macro-num">' + nutrition.water + '</div><div class="macro-unit">补水量</div></div>';
  html += '</div>';
  html += '<div style="font-size:12px;color:var(--text2);margin-bottom:12px;">' + nutrition.timing + ' · 每日蛋白目标：' + nutrition.dailyProtein + '</div>';
  html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">练后补充方案</div>';
  // 从匹配套餐中只展示练后部分
  nutrition.combos.forEach(function(combo, ci) {
    html += '<div class="food-option" style="margin-bottom:8px;">';
    html += '<div class="fo-name">' + combo.post.name + ' <span class="fo-tag">' + combo.post.tag + '</span></div>';
    html += '<div class="fo-items">' + formatItems(combo.post.items) + '</div>';
    html += '<div class="fo-why">' + combo.post.why + '</div>';
    html += '<div class="fo-why" style="color:var(--accent);font-size:11px;margin-top:4px;">搭配练前：' + combo.pre.name + '</div>';
    html += '</div>';
  });
  // 理论说明
  html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">';
  html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">想想为什么？</div>';
  nutrition.theory.forEach(function(t, i) {
    html += '<div class="nutri-q" id="postq-' + i + '">';
    html += '<div class="nq-toggle" data-postq="' + i + '">' + t.title + ' <span class="nq-arrow">▾</span></div>';
    html += '<div class="nq-answer">' + t.text + '</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '</div>';
  html += '</div>';

  // 下次训练预告
  var nextDayIdx = -1;
  for (var i = state.currentDay + 1; i < 7; i++) {
    if (!state.plan.weekPlan[i].isRest) { nextDayIdx = i; break; }
  }
  if (nextDayIdx === -1) {
    for (var i = 0; i < state.currentDay; i++) {
      if (!state.plan.weekPlan[i].isRest) { nextDayIdx = i; break; }
    }
  }
  if (nextDayIdx >= 0) {
    var nextDay = state.plan.weekPlan[nextDayIdx];
    html += '<div class="card" style="text-align:center;">';
    html += '<div style="font-size:13px;color:var(--text2);">下次训练</div>';
    html += '<div style="font-size:18px;font-weight:700;margin-top:6px;">' + nextDay.dayName + ' · ' + nextDay.type + '</div>';
    html += '<div style="font-size:12px;color:var(--text2);margin-top:4px;">' + nextDay.exercises.length + '个动作 · 预计' + state.profile.sessionDuration + '分钟</div>';
    html += '</div>';
  }

  document.getElementById('summaryContent').innerHTML = html;

  // 绑定练后营养问答
  document.querySelectorAll('.nq-toggle[data-postq]').forEach(function(t) {
    t.addEventListener('click', function() {
      this.parentElement.classList.toggle('open');
    });
  });

  showPage('summary');
}

function generateEncouragement(log, completedExercises) {
  var totalExercises = log.exercises.length;
  var completionRate = completedExercises / totalExercises;

  // 检查是否有PR突破
  var hasPR = false;
  log.exercises.forEach(function(ex) {
    var prevLogs = state.logs.filter(function(l) {
      return l.exercises.some(function(e) { return e.exerciseId === ex.exerciseId; });
    });
    if (prevLogs.length > 0) {
      var prevLog = prevLogs[prevLogs.length - 1];
      var prevEx = prevLog.exercises.find(function(e) { return e.exerciseId === ex.exerciseId; });
      if (prevEx && ex.sets[0] && prevEx.sets[0]) {
        if (ex.sets[0].weight > prevEx.sets[0].weight) hasPR = true;
      }
    }
  });

  // 检查连续训练
  var recentLogs = state.logs.slice(-3);
  var consistent = recentLogs.length >= 3;

  if (hasPR) {
    return '又有动作破PR了！重量在涨说明进步看得见。保持这个节奏，但别贪加重量，动作质量第一。';
  } else if (completionRate >= 1) {
    if (consistent) {
      return '今天的训练全部按计划完成，连续训练状态不错。坚持才是最难的，你已经做到了。';
    }
    return '今天的训练全部按计划完成！每次完整完成训练卡就是一步积累，继续保持。';
  } else if (completionRate >= 0.6) {
    return '核心动作都完成了，后面的没做完没关系。状态有起伏很正常，下次把状态留够。';
  } else {
    return '能来练就比不来强。今天先找找感觉，不用赶进度，下次继续。';
  }
}

// ===== 进度页 =====
function renderProgress() {
  if (state.logs.length === 0) {
    document.getElementById('progressContent').innerHTML = '<div class="empty-state"><div class="icon">📊</div><div class="title">还没有训练记录</div><div class="desc">完成第一次训练后这里会显示进度</div></div>';
    return;
  }

  var html = '';

  // 总览统计
  var totalSessions = state.logs.length;
  var totalVolume = 0, totalSets = 0;
  state.logs.forEach(function(log) {
    log.exercises.forEach(function(ex) {
      ex.sets.forEach(function(s) {
        if (s.weight && s.reps) {
          totalVolume += s.weight * s.reps;
          totalSets++;
        }
      });
    });
  });

  // 出勤率（最近4周）
  var fourWeeksAgo = new Date();
  fourWeeksAgo.setDate(fourWeeksAgo.getDate() - 28);
  var recentSessions = state.logs.filter(function(l) {
    return new Date(l.completedAt) >= fourWeeksAgo;
  });
  var expectedSessions = state.plan ? state.plan.daysPerWeek * 4 : 12;
  var attendanceRate = Math.min(100, Math.round(recentSessions.length / expectedSessions * 100));

  html += '<div class="summary-stats">';
  html += '<div class="summary-stat"><div class="stat-num">' + totalSessions + '</div><div class="stat-label">总训练次数</div></div>';
  html += '<div class="summary-stat"><div class="stat-num">' + totalSets + '</div><div class="stat-label">总组数</div></div>';
  html += '<div class="summary-stat"><div class="stat-num">' + Math.round(totalVolume) + '</div><div class="stat-label">总容量(kg)</div></div>';
  html += '</div>';

  // 出勤率
  html += '<div class="card">';
  html += '<div class="card-title">出勤率（最近4周）</div>';
  html += '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + attendanceRate + '%;">' + attendanceRate + '%</div></div>';
  html += '<div style="font-size:12px;color:var(--text2);">已完成 ' + recentSessions.length + ' / ' + expectedSessions + ' 次训练</div>';
  html += '</div>';

  // --- 各动作进度（简洁列表） ---
  html += '<div class="card"><div class="card-title">动作进度</div>';

  var exerciseProgress = {};
  state.logs.forEach(function(log) {
    log.exercises.forEach(function(ex) {
      if (!ex.sets || ex.sets.length === 0) return;
      if (!exerciseProgress[ex.exerciseId]) {
        exerciseProgress[ex.exerciseId] = { name: ex.name, history: [] };
      }
      var maxWeight = 0, maxReps = 0;
      ex.sets.forEach(function(s) {
        if (s.weight && s.weight > maxWeight) maxWeight = s.weight;
        if (s.reps && s.reps > maxReps) maxReps = s.reps;
      });
      exerciseProgress[ex.exerciseId].history.push({
        date: log.date,
        weight: maxWeight,
        reps: maxReps,
        est1RM: maxWeight && maxReps ? estimate1RM(maxWeight, maxReps) : 0
      });
    });
  });

  Object.keys(exerciseProgress).forEach(function(exId) {
    var prog = exerciseProgress[exId];
    if (prog.history.length < 1) return;
    var first = prog.history[0];
    var last = prog.history[prog.history.length - 1];
    var weightChange = last.weight - first.weight;
    var changeStr = weightChange > 0 ? '+' + weightChange + 'kg' : weightChange < 0 ? weightChange + 'kg' : '持平';
    var changeColor = weightChange > 0 ? 'var(--accent)' : 'var(--text2)';

    // 动作名 + 变化
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">';
    html += '<div><div style="font-size:14px;font-weight:600;">' + prog.name + '</div>';
    html += '<div style="font-size:11px;color:var(--text2);margin-top:2px;">最新: ' + last.weight + 'kg × ' + last.reps + '次 · 共' + prog.history.length + '次记录</div></div>';
    html += '<div style="text-align:right;"><div style="font-size:16px;font-weight:700;color:' + changeColor + ';">' + changeStr + '</div>';
    html += '<div style="font-size:11px;color:var(--text3);">估算1RM: ' + last.est1RM + 'kg</div></div>';
    html += '</div>';
  });
  html += '</div>';

  // 最近训练记录
  html += '<div class="card"><div class="card-title">最近训练</div>';
  state.logs.slice(-5).reverse().forEach(function(log) {
    var totalVol = 0;
    log.exercises.forEach(function(ex) {
      ex.sets.forEach(function(s) { if (s.weight && s.reps) totalVol += s.weight * s.reps; });
    });
    var date = new Date(log.completedAt);
    var dateStr = (date.getMonth() + 1) + '/' + date.getDate() + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    html += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">';
    html += '<div><div style="font-size:13px;font-weight:600;">' + log.type + '</div><div style="font-size:11px;color:var(--text2);">' + dateStr + '</div></div>';
    html += '<div style="text-align:right;font-size:13px;">' + Math.round(totalVol) + ' kg</div>';
    html += '</div>';
  });
  html += '</div>';

  document.getElementById('progressContent').innerHTML = html;
}

// 照片临时存储
var measurePhotos = [];

function bindMeasureEvents() {
  var photoInput = document.getElementById('msPhotoInput');
  var photoPreview = document.getElementById('msPhotoPreview');

  photoInput.addEventListener('change', function(e) {
    var files = Array.prototype.slice.call(e.target.files);
    files.forEach(function(file) {
      if (file.size > 5 * 1024 * 1024) {
        showToast('图片 "' + file.name + '" 超过5MB，已跳过');
        return;
      }
      var reader = new FileReader();
      reader.onload = function(ev) {
        compressPhoto(ev.target.result, file.name, function(compressed) {
          measurePhotos.push({ data: compressed, label: '照片' + (measurePhotos.length + 1) });
          renderPhotoPreview();
        });
      };
      reader.readAsDataURL(file);
    });
    photoInput.value = '';
  });

  document.getElementById('saveMeasureBtn').addEventListener('click', saveMeasure);
}

function compressPhoto(dataUrl, fileName, callback) {
  var img = new Image();
  img.onload = function() {
    var maxW = 600, maxH = 800;
    var w = img.width, h = img.height;
    if (w > maxW) { h = h * maxW / w; w = maxW; }
    if (h > maxH) { w = w * maxH / h; h = maxH; }
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', 0.6));
  };
  img.onerror = function() { callback(dataUrl); };
  img.src = dataUrl;
}

function renderPhotoPreview() {
  var el = document.getElementById('msPhotoPreview');
  if (!el) return;
  var html = '';
  measurePhotos.forEach(function(p, idx) {
    html += '<div class="pp-item"><img src="' + p.data + '"><div class="pp-remove" onclick="removeMeasurePhoto(' + idx + ')">✕</div></div>';
  });
  el.innerHTML = html;
}

function removeMeasurePhoto(idx) {
  measurePhotos.splice(idx, 1);

}

    bodyfat: parseFloat(document.getElementById('msBodyfat').value) || null,

  };

  // 至少要有一项数据
  var hasData = rec.bodyweight || rec.bodyfat || rec.chest || rec.waist || rec.hip || rec.armL || rec.armR || rec.thighL || rec.thighR || rec.calfL || rec.calfR || rec.photos.length > 0;

    showToast('请至少填写一项数据');

  state.measurements = state.measurements || [];
  state.measurements.push(rec);
  saveState();
  measurePhotos = [];
  showToast('身体维度记录已保存');
  renderMeasure();
}

// ===== 维度测量节奏判断 =====
function getMeasureReminder() {
  var ms = state.measurements || [];
  if (ms.length === 0) {
    return { needed: true, daysSince: null, reason: '还没有维度记录，建议尽快完成首次测量，建立基线数据' };
  }
  ms.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
  var last = ms[ms.length - 1];
  var lastDate = new Date(last.date);
  var now = new Date();
  var diffDays = Math.floor((now.getTime() - lastDate.getTime()) / (1000 * 60 * 60 * 24));

  // 增肌期：建议每2周（14天）测一次
  var interval = 14;
  if (diffDays >= interval) {
    return { needed: true, daysSince: diffDays, reason: '距上次测量已' + diffDays + '天，建议尽快记录新数据以追踪变化趋势' };
  }
  return { needed: false, daysSince: diffDays, reason: '距上次测量' + diffDays + '天，下次建议在' + (interval - diffDays) + '天后' };
}

    state = { profile: null, plan: null, logs: [], measurements: [], currentDay: null, currentTrainingData: null, quizStep: 0 };
    showPage('quiz');
    renderQuiz();
  }
});

// ===== 组间休息计时器按钮绑定 =====
document.getElementById('rtSkip').addEventListener('click', stopRestTimer);
document.getElementById('rtPause').addEventListener('click', pauseRestTimer);
document.getElementById('rtAdd30').addEventListener('click', function() { addRestTime(30); });

// ===== 初始化 =====
loadState();
if (state.profile && state.plan) {
  renderDashboard();
  showPage('dashboard');
} else {
  renderQuiz();
  showPage('quiz');
}
</script>
